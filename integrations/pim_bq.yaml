# PIM integration — erp-set-up.ctx_upside_master_data (static product truth).
# Maps 6 entity types and 5 relationships to BigQuery tables/views.
# Helper view V_PRODUCT_ENRICHED must exist first — see sql/views.sql.
#
# Category / product line are NOT entities — they are the ProductCategory
# hierarchy, grown from DIM_CATEGORY / DIM_PRODUCT_LINE by the bulk-import
# config in master_data/hierarchy_bulk_import_configs.yaml.
#
# Run:  contextgraph apply -C ./ten-ten-graph -s pim_bq

name: pim_bq
kind: bigquery

connection:
  project:     ${env.GCP_PROJECT}          
  dataset:     ctx_upside_master_data      # the "product_master" dataset never existed under this name — this is it
  credentials: ${env.GOOGLE_APPLICATION_CREDENTIALS_JSON}

entities:
  - type: Product
    table: V_PRODUCT_ENRICHED              # DIM_PRODUCT + PRICING + PACKAGING + NUTRITION (1:1) on SKU
    id: SKU
    properties:
      name:                     DISPLAY_NAME
      # Taxonomy as properties, not edges — these two are what the
      # ProductCategory hierarchy attaches to. Added to V_PRODUCT_ENRICHED
      # 2026-09-23 (see sql/views.sql); re-run that DDL before applying or
      # the extract drops both columns and the hierarchy stays at 0 matched.
      category:                 CATEGORY_NAME
      product_line:             PRODUCT_LINE_NAME
      flavour:                  FLAVOUR
      size_gm:                  SIZE_GM
      size_label:               SIZE_LABEL
      version:                  VERSION
      status:                   STATUS
      veg_nonveg:               VEG_NONVEG
      is_active:                IS_ACTIVE
      description:              DESCRIPTION
      images_link:              IMAGES_LINK
      base_price_inr:           BASE_PRICE_INR
      gst_rate:                 GST_RATE
      mrp_inr:                  MRP_INR
      total_cogs_inr:           TOTAL_COGS_INR
      shelf_life_days:          SHELF_LIFE_DAYS
      packaging_type:           PACKAGING_TYPE
      gs1_barcode:              GS1_BARCODE
      org_labelling_compliance: ORG_LABELLING_COMPLIANCE
      serving_size:             SERVING_SIZE

  - type: Ingredient
    table: DIM_INGREDIENT
    id: INGREDIENT_ID
    properties: { name: INGREDIENT_NAME, category: CATEGORY }

  - type: Allergen
    table: DIM_ALLERGEN
    id: ALLERGEN_ID
    properties: { name: ALLERGEN_NAME }

  - type: Channel
    table: DIM_CHANNEL
    id: CHANNEL_ID
    properties: { name: CHANNEL_NAME, channel_type: CHANNEL_TYPE }

  - type: Competitor
    table: DIM_COMPETITOR
    id: COMPETITOR_ID
    properties:
      name:        COMPETITOR_NAME
      website:     WEBSITE
      hq_city:     HQ_CITY
      country:     COUNTRY
      category:    CATEGORY
      tier:        TIER
      channels:    CHANNELS
      is_active:   IS_ACTIVE

  - type: CompetitorProduct
    table: DIM_COMPETITOR_PRODUCT
    id: COMPETITOR_PRODUCT_ID
    properties:
      product_name: PRODUCT_NAME
      size:         SIZE
      city:         CITY
      is_active:    IS_ACTIVE

relationships:
  - type: contains_ingredient
    table: MAP_PRODUCT_INGREDIENT
    from: { entity: Product,    column: SKU }
    to:   { entity: Ingredient, column: INGREDIENT_ID }

  - type: declares_allergen
    table: MAP_PRODUCT_ALLERGEN
    from: { entity: Product,  column: SKU }
    to:   { entity: Allergen, column: ALLERGEN_ID }
    edge_properties:
      contains_type: CONTAINS_TYPE

  - type: listed_on
    table: MAP_PRODUCT_CHANNEL
    from: { entity: Product, column: SKU }
    to:   { entity: Channel, column: CHANNEL_ID }
    edge_properties:
      applicable:              APPLICABLE
      channel_base_price_inr:  CHANNEL_BASE_PRICE_INR
      channel_gst_rate:        CHANNEL_GST_RATE
      channel_mrp_inr:         CHANNEL_MRP_INR
      channel_cogs_inr:        CHANNEL_COGS_INR
      channel_shelf_life_days: CHANNEL_SHELF_LIFE_DAYS
      primary_sales_owner:     PRIMARY_SALES_OWNER

  - type: maps_to_product
    table: MAP_COMPETITOR_PRODUCT_TO_PRODUCT
    from: { entity: CompetitorProduct, column: COMPETITOR_PRODUCT_ID }
    to:   { entity: Product,           column: SKU }
    edge_properties:
      match_confidence: MATCH_CONFIDENCE
      note:             NOTE

  # CompetitorProduct → Competitor (edge projected off DIM_COMPETITOR_PRODUCT.COMPETITOR_ID).
  - type: catalogued_by
    table: DIM_COMPETITOR_PRODUCT
    from: { entity: CompetitorProduct, column: COMPETITOR_PRODUCT_ID }
    to:   { entity: Competitor,        column: COMPETITOR_ID }
