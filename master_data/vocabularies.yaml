version: 1

# Controlled vocabularies referenced by entity/edge `reference` properties.
#
# Every entry here is referenced by a real property — nothing exists just to
# populate a UI panel. The ~20 `DemoFiller_*` vocabularies (55 "Placeholder"
# members, one per Function/Role/Person so the Organization view showed a
# connection for each) were removed 2026-09-23: on a client tenant a term is
# either real or it is absent. Their org rows now render with no
# accountable_for entry, which is the honest state until ownership is decided.

vocabularies:
  - id: ProductStatus
    name: Product Lifecycle Status
    owner: portfolio_team
    members:
      - { id: Live,             label: "Live",              order: 1 }
      - { id: OccasionallyLive, label: "Occasionally Live", order: 2 }
      - { id: UnderTrial,       label: "Under Trial",       order: 3 }
      - { id: UnderDevelopment, label: "Under Development",  order: 4 }
      - { id: Discontinued,     label: "Discontinued",      order: 5 }

  - id: VegNonVeg
    name: Veg / Non-Veg
    owner: portfolio_team
    members:
      - { id: Veg,    label: "Veg",     order: 1 }
      - { id: NonVeg, label: "Non-Veg", order: 2 }

  - id: ChannelType
    name: Sales Channel Type
    owner: sales_team
    members:
      - { id: Delivery,      label: "Delivery aggregator",  order: 1 }
      - { id: QCommerce,     label: "Quick commerce",       order: 2 }
      - { id: D2C,           label: "Direct-to-consumer",   order: 3 }
      - { id: Retail,        label: "Modern retail",        order: 4 }
      - { id: HoReCa,        label: "HoReCa",               order: 5 }
      - { id: Gifting,       label: "Gifting",              order: 6 }
      - { id: QSR,           label: "QSR",                  order: 7 }
      - { id: Corporate,     label: "Corporate",            order: 8 }
      - { id: Vending,       label: "Vending",              order: 9 }

  - id: ContainsType
    name: Allergen Containment Type
    owner: compliance_team
    members:
      - { id: contains,     label: "Contains (directly in product)",       order: 1 }
      - { id: may_contain,  label: "May contain (facility cross-contact)",  order: 2 }

  - id: SupplierTier
    name: Supplier Classification Tier
    owner: procurement_team_lead
    members:
      - { id: Tier1, label: "Tier 1 — Strategic / Sole Source", order: 1 }
      - { id: Tier2, label: "Tier 2 — Preferred",               order: 2 }
      - { id: Tier3, label: "Tier 3 — Spot / Approved",         order: 3 }

  - id: ContractType
    name: Supplier Contract Cadence
    owner: procurement_team
    members:
      - { id: Annual,    label: "Annual",    order: 1 }
      - { id: Quarterly, label: "Quarterly", order: 2 }
      - { id: Seasonal,  label: "Seasonal",  order: 3 }
      - { id: Weekly,    label: "Weekly",    order: 4 }
      - { id: Spot,      label: "Spot",      order: 5 }
