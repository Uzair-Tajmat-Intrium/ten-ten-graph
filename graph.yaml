project: ten-ten-graph
version: 1


storage:
  backend: postgres
  connection: ${env.DATABASE_URL}

# Entity + relationship definitions (the ontology).
ontology:
  dir: ./ontology
  files:
    entities:      entities.yaml
    relationships: relationships.yaml

# Controlled vocabularies and hierarchies.
# Org chart, KPIs, goals and policies are intentionally absent — the seeded
# versions were demo data and were removed; real ones land here as the customer
# supplies them.
master_data:
  dir: ./master_data
  files:
    vocabularies: vocabularies.yaml
    hierarchies:  hierarchies.yaml
  cache_dir: .contextgraph/refdata_cache

# Operational workflows: inventory optimization, label compliance review,
# idea capture & triage, shelf-life risk monitoring.
processes:
  dir: ./processes

# Lazy dataset links + widgets for fast-moving data (inventory, reviews,
# complaints, forecasts, stock). Seeded on apply; data fetched on demand.
technical_assets:
  catalog_dir: ./technical_assets/catalog

# Upstream source systems — both on GCP project erp-set-up.
integrations:
  dir: ./integrations

# Ontology evolution — each migration applied at most once.
migrations:
  dir: ./migrations

# Sentence-embeddings for the `semantic_neighbors` MCP tool. Disabled for the
# first run so `apply` doesn't need to download the model; enable when ready.
embeddings:
  enabled: false
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2

mcp_server:
  enabled: true
  host: 127.0.0.1
  port: 9090
  auth: none  # dev mode only
