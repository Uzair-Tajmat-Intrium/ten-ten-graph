# Business entity types for the ten-ten graph.
# 9 node types across 5 tiers. Foreign keys are OMITTED from properties —
# they appear as graph relationships instead (see relationships.yaml).
#
# Residency of the data behind each type:
#   PIM      -> erp-setup.ctx_upside_master_data  (extracted, integrations/pim_bq.yaml)
#   LIVE     -> erp-setup.bronze/silver/gold      (extracted, integrations/live_bq.yaml)
#   CURATED  -> authored in-graph, no table yet
#
# A type earns its place here only if an instance has a stable business id,
# someone opens it and decides something about it, and other data hangs off it.
# Fast-moving events (reviews, complaints, inventory batches, campaign
# performance) are lazy dataset links on the entity they happen AT — see
# technical_assets/catalog/link_datasets.yaml. Taxonomy (category, product
# line) is the ProductCategory hierarchy, attached to Product properties below.

entities:

  # ---- Tier 1 : Product / PIM spine -------------------------------------
  - type: Product
    description: A sellable SKU — the pivot of the graph. Fed by product_master, matched to live data by SKU.
    properties:
      - { name: name,                     type: string, required: true }   # DISPLAY_NAME
      - { name: brand,                    type: string }
      - { name: category,                 type: reference, references: ProductCategory }
      - { name: product_line,             type: reference, references: ProductCategory }
      - { name: flavour,                  type: string }
      - { name: size_gm,                  type: number }
      - { name: size_label,               type: string }
      - { name: version,                  type: string }
      - { name: status,                   type: reference, references: ProductStatus }
      - { name: veg_nonveg,               type: reference, references: VegNonVeg }
      - { name: is_active,                type: boolean }
      - { name: description,              type: string }
      - { name: images_link,              type: string }
      - { name: base_price_inr,           type: number }
      - { name: gst_rate,                 type: number }
      - { name: mrp_inr,                  type: number }
      - { name: total_cogs_inr,           type: number }
      - { name: shelf_life_days,          type: number }
      - { name: packaging_type,           type: string }
      - { name: gs1_barcode,              type: string }
      - { name: org_labelling_compliance, type: string }
      - { name: serving_size,             type: string }

  - type: Ingredient
    description: A raw or processed ingredient used in product recipes.
    properties:
      - { name: name,     type: string, required: true }
      - { name: category, type: string }

  - type: Allergen
    description: A declared allergen (Nuts, Dairy, Eggs, Polyols).
    properties:
      - { name: name, type: string, required: true }

  # ---- Tier 2 : Commercial ---------------------------------------------
  - type: Channel
    description: A go-to-market sales channel (Swiggy, Zomato, Blinkit, Zepto, Instamart, D2C, HoReCa, ...).
    properties:
      - { name: name,         type: string, required: true }
      - { name: channel_type, type: reference, references: ChannelType }

  - type: Competitor
    description: A competing brand tracked for pricing & positioning (curated).
    properties:
      - { name: name,      type: string, required: true }
      - { name: website,   type: string }
      - { name: hq_city,   type: string }
      - { name: tier,      type: string }
      - { name: category,  type: string }
      - { name: is_active, type: boolean }

  - type: CompetitorProduct
    description: A competitor SKU in a specific city, matched to one of our products (curated).
    properties:
      - { name: product_name, type: string, required: true }
      - { name: size,         type: string }
      - { name: city,         type: string }
      - { name: is_active,    type: boolean }

  # ---- Tier 3 : Operations (live) --------------------------------------
  - type: Store
    description: A dark-store / fulfilment partner.
    properties:
      - { name: name,                 type: string, required: true }
      - { name: city,                 type: string }
      - { name: latitude,             type: number }
      - { name: longitude,            type: number }
      - { name: pos_software,         type: string }
      - { name: type,                 type: string }
      - { name: location_description, type: string }

  # ---- Tier 4 : Supply (curated, no table yet) -------------------------
  # Declared roadmap, kept deliberately: nothing extracts Supplier today, so
  # supplies_ingredient cannot populate and supplier_coa_renewal cannot fire.
  - type: Supplier
    description: An ingredient supplier (in ERPNext today; extracted later). Curated for now.
    properties:
      - { name: name,            type: string, required: true }
      - { name: tier,            type: reference, references: SupplierTier }
      - { name: category,        type: string }
      - { name: region,          type: string }
      - { name: fssai_certified, type: boolean }
      - { name: lead_time_days,  type: number }
      - { name: is_active,       type: boolean }

  # ---- Tier 5 : Customer -----------------------------------------------
  - type: CustomerSegment
    description: A marketing audience segment, per channel.
    properties:
      - { name: name,      type: string, required: true }
      - { name: code,      type: string }
      - { name: channel,   type: string }
      - { name: is_active, type: boolean }
