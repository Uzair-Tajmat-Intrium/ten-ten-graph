version: 1

processes:
  # Inventory Optimization — per-store actioning of the forecast-vs-stock plan.
  #
  # Walks the assembled per-(store, SKU) plan one STORE at a time — the demand
  # planner approves or skips each store's actions individually (a `type: foreach`
  # step, grouped by store), the approved actions fire immediately, and at the end
  # a single report emails what was actioned vs held.
  #
  # Stepped/agentic mode (no metadata.steps_display_only): the EventAgent walks the
  # steps. review_plan shows the complete plan and gates the whole run; action_rows
  # is the per-row loop; dispatch_report sends the taken/held summary.
  - id: inventory_optimization
    name: Inventory Optimization
    description: |
      Assembles each dark store's per-(store, SKU) inventory plan (transfer / liquidate
      / supply-from-factory), then lets the demand planner action it ROW BY ROW:
      approve a row to fire its action
      now, or reject to skip it. When every row has been decided, a single report is
      emailed listing what was actioned and what was held.

      For the agent: `inventory_plan` is ALREADY assembled and pre-scored — one row per
      at-risk (store, SKU) with `available_quantity`, `expiring_qty`, `forecast_units`
      (ceiled next-3-day demand), `nearest_store_name` (+ `distance_km`) and an
      `action` (`transfer` / `liquidate` / `supply_factory`). At the overview gate,
      summarise it (how many of each action, most urgent); do NOT re-list every row.
    domain: SupplyChain
    owner: demand_planning_team
    definition_type: text

    applies_to:
      - entity: Store
      - entity: Store
        where:
          - { field: id, op: ne, value: __none__ }

    triggers:
      - { type: event, event_type: inventory_optimization }
      - { type: manual, allowed_roles: [DemandPlanner] }

    inputs:
      - { name: store_id, type: reference, references: Store, required: false }
      - { name: scheduled_at, type: datetime, required: false }

    outputs:
      - { name: rows_actioned, type: object }
      - { name: rows_held, type: object }

    steps:
      # 1) FIRST GATE — show the COMPLETE plan; gate the whole run.
      - id: review_plan
        name: Review the inventory plan
        type: decision
        description: Demand planner reviews the full plan and decides whether to action it row by row.
        instruction: >
          `inventory_plan` is the fully-assembled, pre-scored plan. Write a SHORT summary:
          how many SKUs to transfer vs liquidate vs supply-from-factory, across how many
          stores, and the most urgent (smallest days_to_expiry). Recommend "Action the
          Plan" to begin actioning the plan row by row; recommend REJECT to hold the
          whole plan. Do not paste the table.
        decision_options: ["Action the Plan", "REJECT"]
        produces:
          - plan_decision
        key_data:
          - title: "Inventory plan — all rows"
            summary: "Per (store, SKU): action, on-hand, forecast, expiring qty and nearest store"
            views:
              - { view: table, from: inventory_plan, columns: [store_name, product_name, action, available_quantity, forecast_units, expiring_qty, days_to_expiry, nearest_store_name, distance_km] }

      # 2) PER-ROW LOOP — one approve/reject gate per (store, SKU). Approve fires the
      #    row's action immediately; reject skips it. Accumulates into
      #    rows_actioned / rows_held (named via `produces`).
      - id: action_rows
        name: Action each store
        type: foreach
        after: review_plan
        for_each: inventory_plan
        group_by: store_id            # ONE gate per store (~15), not per (store, SKU) row
        description: For each store, review all its recommended actions and approve to take them all, or reject to hold the store.
        instruction: >
          {{store_name}}: review all the recommended actions for this store in the table.
          Choose "Approve Actions" to take ALL of them now, or Reject to hold this
          store's actions.
        decision_options: ["Approve Actions", "REJECT"]
        produces:
          - rows_actioned
          - rows_held
        key_data:
          - title: "Actions for this store"
            summary: "Every (SKU) action recommended at this store"
            views:
              - { view: table, from: foreach_rows, columns: [product_name, action, available_quantity, forecast_units, expiring_qty, days_to_expiry, nearest_store_name, distance_km] }
        # Per-row action fired on APPROVE. Config is templated against the ROW, so
        # bare {{store_name}} etc. resolve to that row's values. Uses `notify`
        # (in-app) as a stand-in until a sales-channel/transfer connector is wired.
        action:
          type: notify
          name: action_row
          config:
            type: notify
            recipient: demand_planning_team
            message: "{{action}} actioned for {{product_name}} at {{store_name}} (nearest {{nearest_store_name}}, {{distance_km}} km; {{expiring_qty}} expiring)."

      # 3) FINAL REPORT — email what was actioned vs held via the Genzoic Email
      #    Formatter skill (clean HTML tables + plain-text fallback, sent through
      #    the org's SendGrid email connector). STEP action => BARE {{fact}}
      #    templating (rows_actioned / rows_held from the foreach; a single-token
      #    {{...}} preserves the native row-list the skill's `records` needs).
      - id: dispatch_report
        name: Email actions taken vs held
        type: notify
        after: action_rows
        description: Email the demand owner the row-by-row outcome once every row is decided.
        produces:
          - report_done
        action:
          type: skill
          name: email_actions_summary
          config:
            type: skill
            skill: "genzoic-email-formatter"     # Skill.name (slug) — call_skill resolves by Skill.name (subprocess gets DB +
                                                  # app imports because it starts with "Genzoic")
            operation: send
            args:
              to: "uzairtajmat7@gmail.com"
              subject: "Inventory plan — actions taken vs held (row-by-row review)"
              title: "Inventory Plan — Actions Taken vs Held"
              intro: >-
                Row-by-row review of the inventory plan is complete. The tables below list the
                (store, SKU) rows actioned now (transfer / liquidate / supply-from-factory)
                and those held / skipped this run.
              sections:
                - type: table
                  caption: "Actioned rows — dispatched now"
                  columns: [store_name, product_name, action, available_quantity, forecast_units, expiring_qty, days_to_expiry, nearest_store_name, distance_km]
                  records: "{{rows_actioned}}"
                - type: table
                  caption: "Held / skipped rows — no action taken"
                  columns: [store_name, product_name, action, available_quantity, forecast_units, expiring_qty, days_to_expiry, nearest_store_name, distance_km]
                  records: "{{rows_held}}"
              footer_note: "Generated automatically by the Inventory Optimization process."

    # Display-only; the goal bindings in goals.yaml deliver the values into a run.
    related_kpis: [near_expiry_units, low_stock_pair_share_pct]

    metadata:
      version: 2
      effective_from: 2026-07-23
      priority: 12
      requires_human_approval: true
      # NO steps_display_only -> process.steps populated -> stepped/foreach path.

      tools:
        skills: []

      # inventory_plan: one named query on the inventory semantic model returns every
      # (store, SKU) with expiring stock or demand above stock — stock, 3-day forecast
      # and nearest transfer store joined in V_INVENTORY_PLAN_INPUTS. `post` only
      # applies this process's action rules and a ceiled `forecast_units` for display.
      context_package:
        - key: inventory_plan
          required: true
          source: semantic_model
          query:
            model_name: inventory_freshness_semantic_model
            name: inventory_plan_rows
          post:
            fillna: { available_quantity: 0, forecast_3d: 0, expiring_qty: 0 }
            compute:
              # days_to_expiry comes from the view.
              # Display forecast: ceil to a whole number, then floor at 1 (never 0)
              # via a bucket — post has no floor/max op, so map <1 -> 1.
              - { as: _fc_ceil, ceil: forecast_3d }
              - as: forecast_units
                bucket:
                  - { when: { field: _fc_ceil, op: lt, value: 1 }, value: 1 }
                  - { else: { col: _fc_ceil } }
              - as: action
                bucket:
                  # Expiring today/tomorrow: a transfer can't arrive and sell in time,
                  # so liquidate (mark down) to recover some value instead of shipping
                  # it. Must come BEFORE the transfer branch, else transfer wins for
                  # any row with a nearby store (which is ~every row).
                  # ponytail: threshold is days_to_expiry <= 1 (the pasted spec's "0-1
                  # days"); widen the value for a longer "transfer not feasible" window.
                  - when:
                      all:
                        - { field: expiring_qty, op: gt, value: 0 }
                        - { field: days_to_expiry, op: lte, value: 1 }
                    value: liquidate
                  # Perishing, still time to move, and a nearby store exists -> transfer.
                  - when:
                      all:
                        - { field: expiring_qty, op: gt, value: 0 }
                        - { field: nearest_store_id, op: ne, value: null }
                    value: transfer
                  # Perishing but no nearby store to take it -> liquidate.
                  - { when: { field: expiring_qty, op: gt, value: 0 }, value: liquidate }
                  # Demand exceeds stock on hand -> replenish from factory.
                  - { when: { field: available_quantity, op: lt, ref: forecast_3d }, value: supply_factory }
                  - { else: hold }
            where:
              - { field: action, op: ne, value: hold }
            drop: [forecast_3d, _fc_ceil]
            sort_by: days_to_expiry
            resolve:
              - { field: store_id, type: Store, as: store_name }
              - { field: product_sku, type: Product, as: product_name }
              - { field: nearest_store_id, type: Store, as: nearest_store_name }
        - { key: scheduled_at, source: event, required: false }
