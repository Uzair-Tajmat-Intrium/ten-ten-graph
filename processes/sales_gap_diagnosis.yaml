# Sales Gap Diagnosis: weekly look at why sales moved - Zomato store performance, Zomato marketing
# effectiveness, Swiggy / other channels, and product performance - then a review gate
# and an email on approval.
# Data: three RAW views in sql/views.sql (V_SALES_GAP_STORE, V_SALES_GAP_PRODUCT,
# V_SALES_GAP_ZOMATO_MKT). They hold numbers only; each diagnose step reads every row and decides
# what moved. Four steps, not one, because a step sees only ~9000 chars of its own fetch; each
# fetch picks only the columns it needs (constant columns like WEEK_END are left out).
# Reads use `entity_type` (one cross-store query), not `entity` (one query per Store entity):
# the views carry 'All stores' rows with MASTER_STORE_ID = 'ALL', which is not a real store.
# Unmapped items (hampers, gift boxes; SKU_ID 'UNKNOWN') are filtered out here, not in the view.
version: 1
processes:
- id: sales_gap_diagnosis
  name: Sales Gap Diagnosis
  description: 'Weekly look at why sales moved, in four parts: every store on Zomato, every store on Swiggy
    and other channels, every product, and the Zomato marketing funnel. The views hold raw numbers only
    (latest week, the week before and the 4-week baseline); the agent decides what moved and why. On approval,
    the summary is emailed to the sales, ops and marketing owners.

    '
  domain: Sales
  owner: sales_team
  applies_to:
  - entity: Store
  - entity: Store
    where:
    - op: ne
      field: id
      value: __none__
  triggers:
  - type: schedule
    cron: 0 8 * * 1
  - type: event
    event_type: sales_gap_diagnosis
  - type: manual
    allowed_roles:
    - DemandPlanner
    - SalesManager
  inputs:
  - name: store_id
    type: reference
    references: Store
  - name: scheduled_at
    type: datetime
  outputs:
  - name: decision
    type: enum
    values:
    - APPROVE
    - REJECT
  - name: zomato_findings
    type: object
  - name: swiggy_findings
    type: object
  - name: product_findings
    type: object
  - name: marketing_findings
    type: object
  related_kpis:
  - DailyGrossSales
  - DailyOrders
  - AverageOrderValue
  - ZomatoROAS
  - WeeklyComplaints
  - AvgStoreRating
  steps:
  - id: zomato_store_performance
    name: 'Zomato: store performance'
    type: agent
    description: How each store's Zomato sales, orders and basket size moved this week vs last week and
      the 4-week baseline, and why.
    fetch:
      entity_type: Store
      source_table: V_SALES_GAP_STORE
      columns:
      - STORE_NAME
      - SALES_CUR
      - SALES_PREV
      - SALES_BASE
      - ORDERS_CUR
      - ORDERS_PREV
      - ORDERS_BASE
      - AOV_CUR
      - AOV_PREV
      - SPEND_DAY_CUR
      - SPEND_DAY_PREV
      - ROI_CUR
      - ROI_PREV
      - IMPR_DAY_CUR
      - IMPR_DAY_PREV
      - M2O_CUR
      - M2O_PREV
      - COMPLAINTS_CUR
      - COMPLAINTS_PREV
      - REVIEWS_CUR
      - RATING_CUR
      - RAIN_DAYS_CUR
      - RAIN_DAYS_PREV
      - OCCASIONS_CUR
      - OCCASIONS_PREV
      filters:
        combinator: AND
        conditions:
        - column: CHANNEL
          op: eq
          value: Zomato
      order_by: SALES_BASE
      order_dir: desc
      limit: 50
      required: true
      as: zomato_rows
    instruction: 'Explain what moved this week for each store on Zomato, and why.

      `zomato_rows` has one row per store on Zomato (plus ''All stores'' = the whole Zomato channel).
      *_CUR is the latest week, *_PREV the week before and *_BASE the 4-week average, all scaled to the
      same number of days, so they compare directly. SPEND_DAY, ROI, IMPR_DAY and M2O are Zomato marketing
      for the latest marketing week vs the one before, per day. COMPLAINTS, REVIEWS, RATING and RAIN_DAYS
      are for the store; OCCASIONS are holidays in each week.

      Work out the changes yourself from these columns. Don''t make anything up, especially numbers: only
      use figures from `zomato_rows` or simple arithmetic on them, and show the figures you used. Only
      cite causes you can see in the rows.

      Return both inside "outputs": zomato_findings = a list of (rank, where, change, cause_type, likely_cause,
      suggested_action) for the rows that matter most (up to 8), and zomato_summary = a short summary.
      `change` is short text such as "<x>% vs baseline, orders <y>%"; cause_type is DEMAND, SUPPLY_OPS,
      MIXED or UNKNOWN.'
    produces:
    - zomato_findings
    - zomato_summary
    key_data:
    - title: 'Zomato: store performance'
      views:
      - view: table
        from: zomato_findings
        columns: &id001
        - rank
        - where
        - change
        - cause_type
        - likely_cause
        - suggested_action
    - title: Zomato summary
      views:
      - view: markdown
        from: zomato_summary
  - id: zomato_marketing_effectiveness
    name: 'Zomato: marketing effectiveness'
    type: agent
    after:
    - zomato_store_performance
    description: 'Whether Zomato ad spend is working: spend, visibility, clicks, conversion and ROI by
      store, this week vs last.'
    fetch:
      entity_type: Store
      source_table: V_SALES_GAP_ZOMATO_MKT
      columns:
      - STORE_NAME
      - SPEND_DAY_CUR
      - SPEND_DAY_PREV
      - AD_SALES_DAY_CUR
      - AD_SALES_DAY_PREV
      - ROI_CUR
      - ROI_PREV
      - BUDGET_USED_CUR
      - BUDGET_USED_PREV
      - AD_IMPR_DAY_CUR
      - AD_IMPR_DAY_PREV
      - AD_ORD_DAY_CUR
      - AD_ORD_DAY_PREV
      - ADS_CTR_CUR
      - ADS_CTR_PREV
      - ADS_M2O_CUR
      - ADS_M2O_PREV
      - IMPR_DAY_CUR
      - IMPR_DAY_PREV
      - ORD_DAY_CUR
      - ORD_DAY_PREV
      - CTR_CUR
      - CTR_PREV
      - M2O_CUR
      - M2O_PREV
      order_by: SPEND_DAY_CUR
      order_dir: desc
      limit: 50
      required: true
      as: marketing_input
    instruction: 'Explain what moved this week for Zomato marketing at each store, and why.

      `marketing_input` has one row per Zomato store (plus ''All stores''). *_CUR is the latest week,
      *_PREV the week before and *_BASE the 4-week average, all scaled to the same number of days, so
      they compare directly. Here CUR/PREV are the latest marketing week vs the one before, and there
      is no BASE. *_DAY values are per day. ROI = ad sales / ad spend; BUDGET_USED = ad spend vs booked
      budget, %; ADS_* is the ad funnel and the rest is the whole restaurant; CTR = clicks / impressions,
      %; M2O = orders / menu opens, %.

      Work out the changes yourself from these columns. Don''t make anything up, especially numbers: only
      use figures from `marketing_input` or simple arithmetic on them, and show the figures you used.
      Only cite causes you can see in the rows.

      Return both inside "outputs": marketing_findings = a list of (rank, where, change, cause_type, likely_cause,
      suggested_action) for the rows that matter most (up to 8), and marketing_summary = a short summary.
      `change` is short text such as "<x>% vs baseline, orders <y>%"; cause_type is DEMAND, SUPPLY_OPS,
      MIXED or UNKNOWN.'
    produces:
    - marketing_findings
    - marketing_summary
    key_data:
    - title: 'Zomato: marketing effectiveness'
      views:
      - view: table
        from: marketing_findings
        columns: *id001
    - title: Marketing summary
      views:
      - view: markdown
        from: marketing_summary
  - id: swiggy_store_performance
    name: 'Swiggy and other channels: store performance'
    type: agent
    after:
    - zomato_marketing_effectiveness
    description: How each store's Swiggy (and other channel) sales, orders and basket size moved, and
      why.
    fetch:
      entity_type: Store
      source_table: V_SALES_GAP_STORE
      columns:
      - STORE_NAME
      - CHANNEL
      - SALES_CUR
      - SALES_PREV
      - SALES_BASE
      - ORDERS_CUR
      - ORDERS_PREV
      - ORDERS_BASE
      - AOV_CUR
      - AOV_PREV
      - COMPLAINTS_CUR
      - COMPLAINTS_PREV
      - REVIEWS_CUR
      - RATING_CUR
      - RAIN_DAYS_CUR
      - RAIN_DAYS_PREV
      - OCCASIONS_CUR
      - OCCASIONS_PREV
      filters:
        combinator: AND
        conditions:
        - column: CHANNEL
          op: in
          value:
          - Swiggy
          - Other
      order_by: SALES_BASE
      order_dir: desc
      limit: 50
      required: true
      as: swiggy_rows
    instruction: 'Explain what moved this week for each store on Swiggy and other channels, and why.

      `swiggy_rows` has one row per store x channel (plus ''All stores'' = the channel total). *_CUR is
      the latest week, *_PREV the week before and *_BASE the 4-week average, all scaled to the same number
      of days, so they compare directly. There is no Swiggy marketing data. COMPLAINTS, REVIEWS, RATING
      and RAIN_DAYS are for the store; OCCASIONS are holidays in each week.

      Work out the changes yourself from these columns. Don''t make anything up, especially numbers: only
      use figures from `swiggy_rows` or simple arithmetic on them, and show the figures you used. Only
      cite causes you can see in the rows.

      Return both inside "outputs": swiggy_findings = a list of (rank, where, change, cause_type, likely_cause,
      suggested_action) for the rows that matter most (up to 8), and swiggy_summary = a short summary.
      `change` is short text such as "<x>% vs baseline, orders <y>%"; cause_type is DEMAND, SUPPLY_OPS,
      MIXED or UNKNOWN.'
    produces:
    - swiggy_findings
    - swiggy_summary
    key_data:
    - title: 'Swiggy and other channels: store performance'
      views:
      - view: table
        from: swiggy_findings
        columns: *id001
    - title: Swiggy summary
      views:
      - view: markdown
        from: swiggy_summary
  - id: product_performance
    name: Product performance
    type: agent
    after:
    - swiggy_store_performance
    description: Which products gained or lost sales and units across all stores and channels, and why.
    fetch:
      entity_type: Product
      source_table: V_SALES_GAP_PRODUCT
      columns:
      - ITEM_NAME
      - SALES_CUR
      - SALES_PREV
      - SALES_BASE
      - UNITS_CUR
      - UNITS_PREV
      - UNITS_BASE
      - COMPLAINTS_CUR
      - COMPLAINTS_PREV
      filters:
        combinator: AND
        conditions:
        - column: SKU_ID
          op: ne
          value: UNKNOWN
      order_by: SALES_BASE
      order_dir: desc
      limit: 100
      required: true
      as: product_input
    instruction: 'Explain what moved this week for each product, and why.

      `product_input` has one row per product across all stores and channels. *_CUR is the latest week,
      *_PREV the week before and *_BASE the 4-week average, all scaled to the same number of days, so
      they compare directly. UNITS are item quantities; COMPLAINTS are complaints linked to the product
      through the order.

      Work out the changes yourself from these columns. Don''t make anything up, especially numbers: only
      use figures from `product_input` or simple arithmetic on them, and show the figures you used. Only
      cite causes you can see in the rows.

      Return both inside "outputs": product_findings = a list of (rank, where, change, cause_type, likely_cause,
      suggested_action) for the rows that matter most (up to 8), and product_summary = a short summary.
      `change` is short text such as "<x>% vs baseline, units <y>%"; cause_type is DEMAND, SUPPLY_OPS,
      MIXED or UNKNOWN.'
    produces:
    - product_findings
    - product_summary
    key_data:
    - title: Product performance
      views:
      - view: table
        from: product_findings
        columns: *id001
    - title: Product summary
      views:
      - view: markdown
        from: product_summary
  - id: sales_head_review
    name: Sales head review
    type: decision
    after:
    - product_performance
    description: The sales head reviews the week's findings and approves sending the brief to sales, ops
      and marketing, or holds it.
    instruction: 'Review the week''s findings: Zomato store performance, Zomato marketing effectiveness,
      Swiggy and other channels, and product performance. Recommend APPROVE to send the weekly sales brief
      so the gaps are followed up in writing, or REJECT if nothing moved. Keep the reasoning short and
      name the one or two most urgent gaps.'
    decision_options:
    - APPROVE
    - REJECT
    produces:
    - review_decision
    key_data:
    - title: 'Zomato: store performance'
      views:
      - view: table
        from: zomato_findings
        columns: *id001
    - title: 'Zomato: marketing effectiveness'
      views:
      - view: table
        from: marketing_findings
        columns: *id001
    - title: 'Swiggy and other channels: store performance'
      views:
      - view: table
        from: swiggy_findings
        columns: *id001
    - title: Product performance
      views:
      - view: table
        from: product_findings
        columns: *id001
    - title: All stores x channels (raw)
      summary: Latest week vs the week before and the 4-week baseline, same number of days
      views:
      - view: table
        from: store_rows
        columns:
        - STORE_NAME
        - CHANNEL
        - SALES_CUR
        - SALES_PREV
        - SALES_BASE
        - ORDERS_CUR
        - ORDERS_PREV
        - ORDERS_BASE
        - AOV_CUR
        - AOV_PREV
        - SPEND_DAY_CUR
        - ROI_CUR
        - M2O_CUR
        - COMPLAINTS_CUR
        - RATING_CUR
        - RAIN_DAYS_CUR
        - OCCASIONS_CUR
        - DAYS_CUR
    - title: Zomato marketing funnel (raw)
      summary: Latest marketing week vs the one before, per loaded day
      views:
      - view: table
        from: marketing_rows
        columns:
        - STORE_NAME
        - SPEND_DAY_CUR
        - SPEND_DAY_PREV
        - ROI_CUR
        - ROI_PREV
        - BUDGET_USED_CUR
        - IMPR_DAY_CUR
        - IMPR_DAY_PREV
        - OPENS_DAY_CUR
        - OPENS_DAY_PREV
        - M2O_CUR
        - M2O_PREV
        - ADS_M2O_CUR
        - ADS_M2O_PREV
        - MKT_DAYS_CUR
        - MKT_WEEK_END
    - title: All products (raw)
      summary: Hampers and gift boxes (unmapped items) left out
      views:
      - view: table
        from: product_rows
        columns:
        - ITEM_NAME
        - SALES_CUR
        - SALES_PREV
        - SALES_BASE
        - UNITS_CUR
        - UNITS_PREV
        - UNITS_BASE
        - COMPLAINTS_CUR
        - COMPLAINTS_PREV
  - id: send_weekly_brief
    name: Send weekly sales brief
    type: notify
    after:
    - sales_head_review
    description: On approval, send the weekly sales brief (Genzoic HTML email via the Genzoic Email Formatter
      skill).
    condition: '{{review_decision}} == "APPROVE"'
    produces:
    - summary_sent
    action:
      type: skill
      name: email_sales_gap_summary
      config:
        type: skill
        skill: genzoic-email-formatter
        operation: send
        args:
          to: kaashvij06@gmail.com
          subject: 'Weekly sales brief: Zomato, Swiggy, products and Zomato marketing'
          title: Weekly Sales Brief
          intro: 'Zomato stores: {{zomato_summary}} Zomato marketing: {{marketing_summary}} Swiggy and
            other channels: {{swiggy_summary}} Products: {{product_summary}}'
          sections:
          - type: table
            caption: 'Zomato: store performance'
            columns: *id001
            records: '{{zomato_findings}}'
          - type: table
            caption: 'Zomato: marketing effectiveness'
            columns: *id001
            records: '{{marketing_findings}}'
          - type: table
            caption: 'Swiggy and other channels: store performance'
            columns: *id001
            records: '{{swiggy_findings}}'
          - type: table
            caption: Product performance
            columns: *id001
            records: '{{product_findings}}'
          footer_note: 'Generated automatically by the Sales Gap Diagnosis process. Latest sales week
            vs the week before and the 4-week baseline, on matched weekdays. Marketing is Zomato only.
            Not in the data yet, so not considered: kitchen prep time (KPT), store online availability,
            order cancellations, inventory, Swiggy marketing, competitor pricing.'
  metadata:
    tools:
      skills: []
    version: 2
    priority: 10
    policy_rules:
    - 'The data is raw: the views do not flag, score or explain anything. Each diagnose step reads every
      row of its view and decides for itself what moved and why. *_CUR is the latest week, *_PREV the
      week before and *_BASE the 4-week average, already scaled to the same number of days.'
    - 'Don''t make anything up, especially numbers: only use figures that are in the rows, or simple arithmetic
      on them, and show the figures used. Only cite causes the rows show.'
    - 'Explain in plain business language: whether a move came from fewer orders or smaller baskets, and
      whether the likely cause is demand-side (marketing, visibility, occasions, weather) or supply/ops-side
      (complaints, rating), or a mix. Point out patterns across stores or products, and say when evidence
      is thin (e.g. a rating from one review).'
    - 'Data caveats: DAYS_CUR is how many of the latest 7 days loaded (the sales feed has missing days,
      so comparisons use matched weekdays). Marketing is Zomato only and runs on its own week (MKT_WEEK_END,
      MKT_DAYS_CUR). Product complaints are only linked to products from Jul 2026. Not in the data, so
      never a cause: kitchen prep time (KPT), store online availability, cancellations, inventory, Swiggy
      marketing, competitor pricing.'
    effective_from: '2026-09-29'
    context_package:
    - key: store_rows
      gather:
        base:
          entity_type: Store
          dataset: V_SALES_GAP_STORE
          limit: 200
      required: false
    - key: product_rows
      gather:
        base:
          entity_type: Product
          dataset: V_SALES_GAP_PRODUCT
          limit: 200
          filters:
            combinator: AND
            conditions:
            - column: SKU_ID
              op: ne
              value: UNKNOWN
      required: false
    - key: marketing_rows
      gather:
        base:
          entity_type: Store
          dataset: V_SALES_GAP_ZOMATO_MKT
          limit: 50
      required: false
    - key: scheduled_at
      source: event
      required: false
    run_steps_before_gate: true
    requires_human_approval: true
