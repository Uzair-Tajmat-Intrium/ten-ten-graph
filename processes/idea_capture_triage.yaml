version: 1

processes:
  - id: idea_capture_triage
    name: Idea Capture & Triage
    description: |
      Receives an idea as raw text or an existing idea_id from DIM_IDEA. Reads every
      pipeline idea, every live SKU and the per-category competitor counts from
      V_TRIAGE_SIMILARITY_CANDIDATES across two matching steps — each taking its own share
      of the packed view so nothing is silently truncated — so the duplicate,
      prior-rejection and portfolio-coverage checks see the whole set. Checks which
      ingredients we already buy and which are off-brand, whether the idea falls inside
      the lines and cost envelope we manufacture today, then web-searches its external
      market situation. The founder's cards render the full briefs; the deciding model
      reads only short grounded scalars.
    domain: Innovation
    owner: npd_team

    triggers:
      - { type: manual, allowed_roles: [npd_team, Admin] }
      - { type: event, event_type: idea_capture_triage }

    inputs:
      - { name: idea_input, type: string, required: true,
          description: "Either an idea_id (e.g. IDE-002) to look up an existing row in DIM_IDEA, or raw text describing a new idea (name, hypothesis, target category)." }
      # Optional structured overrides. Both win over anything parsed out of `idea_input`'s
      # free text and land in DIM_IDEA when the reviewer approves or rejects.
      - { name: hypothesis_input, type: string, required: false,
          description: "The idea's hypothesis in the founder's own words. Overrides whatever the free text implies; written to DIM_IDEA.HYPOTHESIS on approve or reject. Keep it to a sentence or two — long values are shortened before the step reads them." }
      - { name: target_cogs_input, type: number, required: false,
          description: "Target cost of goods per unit in INR. Overrides any figure in the free text; written to DIM_IDEA.TARGET_COGS_INR on approve or reject." }

    outputs:
      - { name: triage_brief, type: string }
      - { name: ingredient_brief, type: string }
      - { name: feasibility_brief, type: string }
      - { name: market_situation_brief, type: string }
      - { name: decision_summary, type: string }
      - { name: decision, type: enum, values: [APPROVE, REJECT, ESCALATE] }

    steps:
      - id: match_pipeline_ideas
        name: Match Against the Idea Pipeline
        type: agent
        description: >
          Matches the incoming idea against every pipeline idea, including rejected ones, to
          find duplicates and prior rejections and to carry an existing idea's stored values
          forward.
        # SPLIT FROM match_portfolio_and_market on purpose. A step's own `fetch` is the only
        # payload that reaches the model un-previewed, but it is tail-sliced at 9000 chars and
        # all five arms together measured 16904. The cap is PER STEP, so filtering SRC here and
        # there gives each half its own budget. Keep the two filters exhaustive: an arm in
        # neither is read by nobody.
        fetch:
          entity_type: Product
          source_table: V_TRIAGE_SIMILARITY_CANDIDATES
          columns: [SRC, ID, NM, D]
          filters:
            combinator: AND
            conditions:
              - { column: SRC, op: in, value: ['1_IDEA', '9_END'] }
          # SRC asc puts 9_END last, so the sentinel is the first row a tail cut destroys.
          order_by: SRC
          order_dir: asc
          limit: 400
          required: true
          as: idea_candidates
        # NULL vs "NONE" is load-bearing: a null produce is dropped from the facts bag, so at
        # the gate "checked, absent" would look identical to "step failed". Write-back fields
        # stay null (unrendered -> SQL NULL -> COALESCE keeps the stored value); anything the
        # gate reads uses the literal "NONE".
        # The first five are read by name in the approve/reject actions, so they can never be
        # folded into a brief. Dropping matched_idea_id blanks the upsert key, and
        # generate_key_if_blank then mints a duplicate instead of updating the matched idea.
        produces: [matched_idea_id, idea_name, hypothesis, thesis_fit, target_cogs_inr,
                   similar_ideas, prior_rejection_id, pipeline_overlap, idea_set_status]
        # One authored card replaces the auto per-fact cards entirely, so the codes and
        # write-back fields above stay produced without each minting its own card. Cards render
        # facts UNCOMPACTED, unlike a step prompt -- this is display only, nothing else moves.
        key_data:
          - title: "Pipeline match"
            summary: "Existing pipeline ideas this one resembles, with their stage and target COGS"
            views:
              - { view: table, from: similar_ideas, columns: [IDEA_ID, NAME, STAGE, TARGET_COGS_INR] }
        instruction: >
          Match this idea against `idea_candidates` (your step input) and `idea_input`, plus
          `hypothesis_input` and `target_cogs_input` if the founder supplied them. Reason only
          from those. Write for a founder in `pipeline_overlap` and any prose: no field names
          or row labels. The status and id facts below are codes — emit their exact literals.

          Every row is a pipeline idea, `SRC` "1_IDEA": `ID` is its idea id, `NM` its name, and
          `D` packs `<stage>|<target_cogs>` positionally — stage first, then target COGS, either
          possibly empty. Stage is one of Capture / Triage / Feasibility / Pipeline /
          Development / Launch / Rejected. One row has `SRC` "9_END": the end-of-list sentinel.

          Set `idea_set_status` FIRST: "COMPLETE" if a "9_END" row is present, else "TRUNCATED"
          — the list was cut, so absence proves nothing and you must not report "none found"
          for anything. If `idea_candidates` is absent or flagged upstream, "UNAVAILABLE" and
          every other output null or "NONE".

          `idea_input` is an id ONLY if character-for-character equal to some row's `ID`;
          anything else is raw concept text.

          WRITE-BACK FIELDS go into the idea record, so copy VERBATIM from the matched row —
          never compose or improve — and use null when unknown:
          `matched_idea_id` the matched row's `ID`, ONLY on an exact id match. A close name
          match is not enough: a name-only re-triage deliberately creates a new record rather
          than overwriting the wrong one.
          `idea_name` the matched row's `NM`, else the name parsed from the input.
          `hypothesis` `hypothesis_input` VERBATIM when the founder supplied one — it outranks
          the matched row and anything the free text implies — else only what the input
          literally states, else null. `thesis_fit` only what the input literally states, else
          null. Neither is in `D`, and null is correct: it leaves any stored value untouched.
          `target_cogs_inr` `target_cogs_input` when supplied, else the number after the "|" in
          the matched row's `D`, else the target COGS the input states, else null. Emit it as a
          number, never quoted text — it lands in a numeric column.

          `prior_rejection_id` the `ID` of the closest row whose stage is exactly "Rejected"
          and which matches this idea by name or concept, else the literal "NONE". Never infer
          a rejection from similarity — this is the only evidence of one.

          `pipeline_overlap` at most 20 words describing the closest matching pipeline idea by
          form factor, flavour family or target need — its name and how close it is — else
          "NONE". Plain words, never an id as the subject.

          `similar_ideas` only genuinely similar rows, always including an exact id match and
          any "Rejected" near-duplicate. Each object exactly {"IDEA_ID","NAME","STAGE",
          "TARGET_COGS_INR"}, values from the one row it came from, never mixed across rows,
          stage and COGS unpacked from that row's `D`. If none:
          [{"NAME": "No similar ideas found"}].

      - id: match_portfolio_and_market
        name: Match Against Live Products & Market
        type: agent
        description: >
          Matches the idea against every live SKU to decide whether we already sell it or would
          be extending a line, and reads the category's competitor signal.
        after: match_pipeline_ideas
        # The other half of the split (see match_pipeline_ideas). 2_PORT sorts first because
        # duplicate detection needs every SKU; 4_COMP last because it only supplies examples
        # and the counts live on 3_CAT.
        fetch:
          entity_type: Product
          source_table: V_TRIAGE_SIMILARITY_CANDIDATES
          columns: [SRC, ID, NM, D]
          filters:
            combinator: AND
            conditions:
              - { column: SRC, op: in, value: ['2_PORT', '3_CAT', '4_COMP', '9_END'] }
          order_by: SRC
          order_dir: asc
          limit: 400
          required: true
          as: market_candidates
        # portfolio_duplicate and candidate_set_status are read by the gate, not shown: the
        # triage_tiers rules compare them (portfolio_duplicate_exact, and a TRUNCATED set is
        # what stops "none found" being trusted).
        produces: [triage_brief, similar_competitor_products, portfolio_duplicate,
                   portfolio_overlap, target_category, candidate_set_status, competitive_reason]
        key_data:
          - title: "Triage brief"
            summary: "Pipeline overlap, portfolio overlap, prior rejections and competitor signal"
            views:
              - { view: markdown, from: triage_brief }
              - { view: table, from: similar_competitor_products, columns: [COMPETITOR_PRODUCT_ID, PRODUCT_NAME, COMPETITOR_ID] }
        instruction: >
          Work from `market_candidates` (your step input) plus `idea_name`, `pipeline_overlap`
          and `prior_rejection_id` from the previous step. Reason only from those.

          Cards are `### Title` plus 1-3 factual lines copied from rows you can point to;
          "None found" when empty. Write for a founder: no field names, enum values or row
          labels anywhere in the cards or `competitive_reason`.

          Grains, by `SRC`. `D` is packed positionally in each case:
          "2_PORT" a live SKU we sell — `ID` is its SKU, `NM` its name, `D` is
          `<status>|<category>|<cogs>`. Status is a product status, never an idea stage, so
          never call a SKU "rejected".
          "3_CAT" one row per category and the ONLY source of counts — `NM` is the category and
          `D` packs `competitor_products=<n>; competitors=<n>; active_skus=<n>; units_90d=<n>;
          growth_pct=<n>`. Read those numbers, never count rows. `not_comparable` means the
          vocabularies do not align, NOT zero; `no_baseline` means no prior sales.
          "4_COMP" a competitor product, `D` is `<competitor_id>|<category>`. Capped at two per
          category, so these are examples only — never count them.
          "9_END" the end-of-list sentinel.

          Set `candidate_set_status` FIRST: "COMPLETE" if a "9_END" row is present, else
          "TRUNCATED" — the list was cut, so write "Not assessed — incomplete comparison set"
          instead of any "None found" and say so in `competitive_reason`. If `market_candidates`
          is absent or flagged upstream, "UNAVAILABLE", every card "Data unavailable" and every
          other output "NONE".

          `triage_brief` — four cards, in order:
          `### Pipeline Overlap` `pipeline_overlap` from the previous step, verbatim.
          `### Portfolio Overlap` the closest "2_PORT" row, its category, and whether it already
          covers this idea.
          `### Prior Rejections` the prior rejection in plain words when `prior_rejection_id` is
          not "NONE", else "None found". Never infer one from similarity.
          `### Competitor Signal` the `competitor_products` number from this category's "3_CAT"
          row, then up to two example products. If no category row matches, say which
          categories are present.

          `portfolio_duplicate` one of "EXACT" (same product, flavour AND pack size — all
          three), "LINE_EXTENSION" (same product, new flavour or pack size), or "NONE". When
          flavour or pack size is unreadable choose LINE_EXTENSION: a wrong EXACT kills a viable
          idea, a wrong LINE_EXTENSION only asks a human.
          `portfolio_overlap` at most 15 words naming that SKU; "NONE" exactly when
          `portfolio_duplicate` is "NONE".
          `target_category` a category name copied from a "3_CAT" row, else "NONE".

          `similar_competitor_products` only genuinely similar "4_COMP" rows, each exactly
          {"COMPETITOR_PRODUCT_ID","PRODUCT_NAME","COMPETITOR_ID"}, the competitor id unpacked
          from that row's `D`. If none:
          [{"PRODUCT_NAME": "No similar competitor products found"}].

          `competitive_reason` one plain sentence, at most 25 words, leading with the strongest
          of: a prior-rejected duplicate, a live product overlap, or this category's competitor
          count. Say plainly when nothing similar exists.

      - id: check_ingredient_availability
        name: Check Ingredient Availability
        type: agent
        description: >
          Derives the ingredients the idea would need, matches each against the ingredient
          master — every entry there is already used in a live SKU, so a match means "we
          already buy this" — and judges each against the better-for-you brand line.
        after: match_portfolio_and_market
        # Step fetch, not a context key: the 153-row master would arrive cut to 4 rows.
        # Name-only keeps it ~7.5k of the 9k cap; adding INGREDIENT_ID overflows to ~11.8k.
        fetch:
          entity_type: Ingredient
          source_table: DIM_INGREDIENT
          columns: [INGREDIENT_NAME]
          order_by: INGREDIENT_NAME
          order_dir: asc
          limit: 500
          # required: with the key merely absent, "no match" and "no master" look the same
          # and the step reports a whole net-new supply chain for ingredients we already buy.
          required: true
          as: ingredient_master
        # `*_count` scalars exist alongside the lists because the gate reads scalars: a
        # list arrives previewed to 4 rows.
        # The two name LISTS are not facts: they duplicated cards 2 and 3 of ingredient_brief
        # verbatim, so nothing read them. The counts and out_of_scope_is_core stay -- the
        # feasibility ladder and triage tiers compare them, and a rule needs the value.
        produces: [ingredient_brief, ingredient_coverage, missing_ingredient_count,
                   out_of_scope_count, out_of_scope_is_core, ingredient_reason]
        key_data:
          - title: "Ingredient availability"
            summary: "Already sourced, needs new sourcing, and anything outside the brand line"
            views:
              - { view: markdown, from: ingredient_brief }
        instruction: >
          Work from `ingredient_master` (your step input) plus `idea_name` and `hypothesis`.
          Reason only from those.

          Cards are `### Title` plus 1–2 factual lines; "None found" when empty. Write for a
          founder: no field names or enum values in the cards or `ingredient_reason`.

          `ingredient_master` is the ingredient names we already source, each used in a live
          SKU. It carries NO stock quantities — never say an ingredient is in or out of
          stock, only that we already buy it or would need to start. Treat it as COMPLETE
          unless it is absent, flagged upstream, or its final entry is cut mid-word. Only
          then is an unmatched ingredient UNKNOWN rather than net-new: mark those
          "(unverified — ingredient list incomplete)" and say so in `ingredient_reason`.
          Not finding an ingredient in a complete list is a finding, not a doubt — never
          add that mark, and never carry it onto the second card.

          Derive the 5–12 ingredients this product would plausibly need — concrete ("whey
          protein isolate", "dates"), not categories. These are your inference from a name,
          not data, so do not present them as a bill of materials. Match by meaning, not
          string ("Almonds" matches "almond"), claiming a match only when you can name the
          entry supporting it. A category relation is not a match: "cocoa powder" is not
          "cocoa butter".

          BRAND LINE — judge each derived ingredient against our better-for-you snacks
          portfolio. IN SCOPE: whole grains, nuts, seeds, fruits, cocoa, natural plant or
          dairy proteins, whole-food sweeteners (dates, jaggery, honey, monk fruit, stevia).
          OUT OF SCOPE: refined sugars and syrups (granulated, caster or icing sugar,
          glucose, invert or corn syrup); refined-flour bases (maida, biscuit or cookie
          crumbs, wafers); hydrogenated, interesterified or palm shortening fats; gelatin
          and other animal-derived or non-vegetarian ingredients; artificial colours,
          flavours, preservatives and high-intensity sweeteners; fitness-supplement actives
          and performance chemicals (creatine, BCAAs, beta-alanine, L-carnitine); synthetic
          pharmaceutical compounds. For anything named in neither list, ask whether a
          better-for-you label would print it with pride; if not, it is out of scope.
          Scope is decided BEFORE sourcing and outranks it: an out-of-scope ingredient goes
          on the third card whether or not we already buy it, and never on the first two.
          Judge what the ingredient is, not what the idea's name suggests.

          `ingredient_brief` — three cards, in order:
          `### Already Sourced` every matched in-scope ingredient with the entry it matched.
          `### Needs New Sourcing` every unmatched in-scope ingredient.
          `### Out of Brand Scope` every off-brand ingredient with the one-phrase reason it
          fails (e.g. "creatine monohydrate — fitness-supplement active").
          List them all rather than summarising: the three cards must account for every
          ingredient you derived, exactly once each, so the counts stay checkable.

          `ingredient_coverage` {"derived": <int>, "matched": <int>} — `derived` is the total
          across all three cards, `matched` the first card's length.
          `missing_ingredient_count` the second card's length, and `out_of_scope_count` the
          third card's length — 0, never null, when there are none. The cards themselves are
          the list; count what you wrote there rather than re-deriving it.
          `out_of_scope_is_core` whether an off-brand ingredient IS the premise rather than
          an addition. "YES" remove it and no product is left (a creatine gummy). "NO" the
          product stands without it (a date-and-almond bar that adds BCAAs is still a
          date-and-almond bar). "NONE" the count is 0. Judge from the idea, not the count:
          two incidental additives are "NO", one load-bearing active is "YES".
          `ingredient_reason` one plain sentence, ≤25 words: "N of M ingredients already
          sourced; needs X new; Y off-brand", naming the off-brand ones when Y > 0.

      - id: assess_feasibility
        name: Assess Feasibility & Applicability
        type: agent
        description: >
          Judges whether we could plausibly make this at all — whether it falls inside a
          line we manufacture today, whether its target COGS sits inside that line's
          observed range, and how much net-new sourcing it needs.
        after: check_ingredient_availability
        fetch:
          # entity_type was ProductLine until that type was demoted to a
          # ProductCategory hierarchy level (2026-09-23). Product is the carrier type;
          # the catalog row for V_PRODUCT_LINE_CAPABILITY was re-homed to match, and
          # the (entity_type, dataset) pair MUST agree with it or this read 404s.
          entity_type: Product
          source_table: V_PRODUCT_LINE_CAPABILITY
          columns: [PRODUCT_LINE_NAME, CATEGORY_NAME, ACTIVE_SKUS, MIN_COGS_INR, MAX_COGS_INR, AVG_SHELF_LIFE_DAYS]
          order_by: CATEGORY_NAME
          order_dir: asc
          limit: 100
          # required: an empty view looks exactly like "no line covers this form factor",
          # which is NOT_APPLICABLE on every idea.
          required: true
          as: production_capability
        produces: [feasibility_brief, feasibility_verdict, feasibility_reason]
        key_data:
          - title: "Feasibility"
            summary: "Capability fit against the lines we make today, cost envelope and applicability risk"
            views:
              - { view: markdown, from: feasibility_brief }
        instruction: >
          Work from `production_capability` (your step input) plus `idea_name`,
          `hypothesis`, `thesis_fit`, `target_cogs_inr`, `ingredient_coverage`,
          `missing_ingredient_count`, `out_of_scope_count` and `out_of_scope_is_core`.
          Reason only from those.

          Cards are `### Title` plus 1–2 factual lines; "None found" when empty. IN THE CARDS
          AND `feasibility_reason` write for a founder — no verdict codes, no field names. Say
          "outside what we can make today" when, and only when, no line covers this form
          factor; a line you can quote is inside what we make, even where the verdict is
          STRETCH for some other reason. `feasibility_verdict` is the exception and is
          REQUIRED: it IS a code, so always emit one of the three below. Null it only when
          `production_capability` itself is missing.

          `production_capability` is every line we manufacture today, one row per line with
          its category, active SKU count, observed COGS range and shelf life. A form factor
          absent from it is one we have NEVER made — treat it as such, not as unknown. But if
          the list itself is absent or flagged upstream, do NOT judge capability: every card
          "Data unavailable", `feasibility_verdict` null, and say so in `feasibility_reason`.

          `feasibility_brief` — three cards, in order:
          `### Capability Fit` the closest line(s), quoting line name, category and active SKU
          count verbatim. If you cannot quote a row, say plainly that no existing line covers
          this form factor — never describe a line that is not in the list.
          `### Cost Envelope` the closest line's min and max COGS quoted first, then whether
          the target COGS is inside, below or above. If none was stated, "None found — no
          target COGS stated"; never infer one.
          `### Applicability Risk` why this may not be worth pursuing: no capability match, an
          off-brand ingredient, a large net-new list, no thesis fit, or an incoherent concept.
          When `out_of_scope_count` > 0, lead with that — the hardest of these risks.

          `feasibility_verdict` exactly one of FEASIBLE, STRETCH, NOT_APPLICABLE, first match
          wins (mirrors metadata.feasibility_ladder — change both together):
          - NOT_APPLICABLE if `out_of_scope_is_core` is "YES" (no reformulation to discuss),
            OR `out_of_scope_count` is 3+, OR you cannot quote a line covering this form
            factor, OR `missing_ingredient_count` > 5, OR the concept is incoherent for a
            better-for-you portfolio. Never made is NOT_APPLICABLE, never STRETCH.
          - STRETCH if `out_of_scope_count` is 1–2 with `out_of_scope_is_core` "NO", OR the
            closest quotable line is adjacent rather than covering, OR
            `missing_ingredient_count` is 3–5.
          - FEASIBLE only with a quoted covering line, `out_of_scope_count` 0 and
            `missing_ingredient_count` 2 or fewer.
          If `missing_ingredient_count` is unavailable, judge on capability alone and say so
          rather than guessing.

          `feasibility_reason` one plain sentence, ≤25 words: the verdict in plain words, then
          the line you quoted and the count that drove it — or the off-brand ingredient, when
          that is what decided it.

      - id: research_market_situation
        name: Research Market Trends & Competitors
        type: agent
        description: >
          Web-searches the idea's product and category for its external market situation —
          typical retail price, where it is sold, and its reach with customers.
        after: assess_feasibility
        # `skill.args` ARE templated (unlike `instruction`). Both are whole-string tokens,
        # so a missing fact would pass None — step 1 guarantees the literal "NONE".
        skill:
          name: research-market-situation
          operation: run
          args:
            idea_input: "{{idea_name}}"
            target_category: "{{target_category}}"
          as: market_research_raw
        produces: [market_situation_brief, decision_summary, market_reason]
        key_data:
          - title: "Market situation"
            summary: "Retail price, where it is sold and customer reach, each line citing its source domain"
            views:
              - { view: markdown, from: market_situation_brief }
              - { view: markdown, from: decision_summary }
        instruction: >
          The web-research skill has already run; its raw payload is `market_research_raw`.
          Reason over that ONLY and never invent data beyond it. The four one-line `*_reason`
          facts are short enough to arrive whole and are the only other content you may use —
          every other upstream fact reaches this step cut to roughly 200 characters, so
          anything drawn from one will be wrong.

          If `market_research_raw` is absent, empty or flagged upstream: set all three cards
          to "None found", set `market_reason` to "No external market signal found", and
          still produce `decision_summary`. Do not fill the gap from general knowledge — a
          plausible price for this kind of product is exactly the failure this prevents.

          `market_situation_brief` — cards are `### Title` plus 1–3 short factual lines.
          Every line stating a price, rating, review count or seller must cite its source
          domain in-line (e.g. "(amazon.in)"); a claim you cannot attribute to a domain in
          the payload must be DROPPED, not softened. Exactly three cards, in order:
          `### Retail Price` typical range with currency and an example seller.
          `### Where Sold` retailers, marketplaces or channels carrying this or comparable
          products.
          `### Customer Reach` traction signals — review counts, ratings, popularity, or
          leading brands in the category.

          `decision_summary` EXACTLY four lines, each an upstream step's own one-line reason
          copied VERBATIM behind its label. Copy the sentences; do not re-word, merge,
          extend or re-order them:
          `Pipeline & competition: <competitive_reason>`
          `Ingredients: <ingredient_reason>`
          `Feasibility: <feasibility_reason>`
          `Market: <market_reason>`
          If one of those facts is missing, write "not available" as that line's value
          rather than composing a replacement.

          `market_reason` one plain sentence, at most 25 words: the headline price point,
          the main channel and the traction signal. If the web data is empty, exactly "No
          external market signal found".

      - id: hitl_approval
        name: Executive Review & Decision
        type: human
        description: >
          Review the triage, ingredient, feasibility and market briefs. APPROVE to advance
          the idea to 'Triage', REJECT if a live product or prior rejection covers it, or
          ESCALATE for a founder decision.
        after: research_market_situation
        # This REPLACES the description as the model's task (event_agent resolves
        # `instruction or description or name`), so it carries the framing too. The tiers
        # must live here: policy_rules is never read on the EventAgent path.
        instruction: >
          Review this idea's triage and recommend exactly one of APPROVE, REJECT or
          ESCALATE.

          Use only these short facts, which arrive whole: `prior_rejection_id`,
          `portfolio_duplicate`, `portfolio_overlap`, `idea_set_status`,
          `candidate_set_status`, `pipeline_overlap`,
          `feasibility_verdict`, `missing_ingredient_count`, `out_of_scope_count`,
          `out_of_scope_is_core`, `ingredient_coverage`, `target_category`, and the four
          reasons `competitive_reason`, `ingredient_reason`, `feasibility_reason`,
          `market_reason`. Everything else — the briefs, tables, raw payloads,
          `decision_summary` — reaches you as a fragment and renders in full for the reviewer
          anyway, so never read or quote it. "NONE" means checked and absent; a fact missing
          entirely means its step failed, which is unknown, not absent.

          THREE TIERS, first match wins. They are mutually exclusive: ESCALATE is a closed
          list of strategic decisions, not the residue when the other two miss. If nothing
          matches, that is a gap in these rules — say so and pick the tier you can justify
          from a named fact.

          TIER 1 — REJECT. Hard non-starters, none overridable by demand except through
          TIER 3's first line:
          - `portfolio_duplicate` "EXACT" ("LINE_EXTENSION" is TIER 2, not this).
          - `out_of_scope_is_core` "YES", or `out_of_scope_count` 3+ whatever is_core says.
          - `feasibility_verdict` NOT_APPLICABLE for a capability reason per
            `feasibility_reason` — read TIER 3's first line before rejecting here.
          - `prior_rejection_id` other than "NONE" — the only evidence of a rejection; never
            infer one from similarity.
          - `missing_ingredient_count` more than 5.

          TIER 2 — APPROVE. EVERY one of: `prior_rejection_id` "NONE"; BOTH `idea_set_status`
          and `candidate_set_status` "COMPLETE"; `out_of_scope_count` 0;
          `missing_ingredient_count` 2 or fewer; `feasibility_verdict` FEASIBLE;
          `portfolio_duplicate` "NONE" or "LINE_EXTENSION". No single fact carries an approve
          on its own — a line extension is the cheapest kind of yes, since we already own the
          line, recipe and supply chain, but it does not excuse a check that failed above.
          Then name in one line what makes it worth doing: reuse of a line we already run, or
          a category gap in `competitive_reason` with positive demand in `market_reason`.

          TIER 3 — ESCALATE. Only these:
          - Strong demand against a capability gap: NOT_APPLICABLE on capability while
            `market_reason` shows unusually strong demand. The one line that outranks a
            TIER 1 capability reject — the founder decides if demand justifies new capability.
          - Reformulation question: `out_of_scope_count` 1–2 with `out_of_scope_is_core` "NO".
            Frame it as a reformulation decision, not a verdict on the idea.
          - High setup cost with strong unit economics: `missing_ingredient_count` 3–5 while
            `feasibility_reason` puts target COGS inside the line's range.
          - `feasibility_verdict` STRETCH.

          DATA GAPS override all three tiers. Two lists are read, each with its own status, so
          EITHER `idea_set_status` or `candidate_set_status` being other than "COMPLETE" is a
          gap — the first means the pipeline was only partly compared (so a prior rejection may
          be unseen), the second the live products and market. If either is not "COMPLETE", or
          any of the counts, `out_of_scope_is_core`, `portfolio_duplicate` or
          `feasibility_verdict` never arrived, the check was not performed: ESCALATE and name
          what is missing. If `ingredient_reason` says the ingredient list was incomplete or
          unverified, the sourcing check did not really run either — also a gap. Never read a
          missing count as zero, never REJECT on a check that did not run.

          `market_reason` is external web data, directional only — never decide on it alone;
          corroborate with `competitive_reason`.

          WRITE FOR THE FOUNDER. Your reason cards go to someone who has never seen this
          schema. Name the business evidence — the idea's name, the SKU's name, the
          ingredient, the number — never the field it came from, and never a field name, enum
          value or row label. Lead with names, not ids; an id may appear once in brackets,
          never as the subject. So: "we already sell this exact product", "a new flavour of
          one we already make", "outside what we can make today", "adjacent to a line we
          run", "four ingredients we don't buy today", "already rejected: <idea name>", "we
          could only compare against part of the pipeline", "the off-brand ingredient is the
          whole premise". State no price, SKU, idea, ingredient or count that is not in one of
          the facts above.
        # A verbatim copy of the four per-step reasons. Do not point this at a brief: an
        # LLM asked to combine briefs it can only see ~200 chars of will invent the rest.
        rationale_from: decision_summary
        decision_options: [APPROVE, REJECT, ESCALATE]

    metadata:
      version: 17
      effective_from: 2026-08-13
      requires_human_approval: true
      # Run the five agent steps BEFORE pausing, so their briefs and reasons exist to bind
      # to the founder's cards and rationale.
      run_steps_before_gate: true
      # Stepped processes otherwise complete without firing metadata.actions.
      run_actions_on_decision: true
      # The "Why AI recommends this" cards cannot be authored — titles, bodies and count are
      # all model-authored via event_agent's {title, body, tone} contract. The one-line
      # `*_reason` facts are what those cards paraphrase, which is why they must be written
      # in business language at source.

      # Empty lists = the gate's tool loop gets no skills or connectors. Without this it was
      # offered the whole org catalogue mid-decision. research-market-situation is
      # deliberately absent: a step's own `skill:` bypasses this scope and still fires.
      tools:
        skills: []
        connectors: []
        allow_unlisted_skills: false

      # Cut-points behind `feasibility_verdict`. Off-thesis ingredients turn on WHETHER THE
      # ACTIVE IS THE PREMISE, not only how many: a creatine gummy is NOT_APPLICABLE at
      # count 1, two incidental additives on a clean bar are a STRETCH. Documentation only —
      # instructions are not templated from metadata, so keep this and
      # assess_feasibility's `instruction` in sync.
      feasibility_ladder:
        NOT_APPLICABLE:
          out_of_scope_is_core: true
          out_of_scope_ingredients_gte: 3
          no_quotable_product_line: true      # never made -> NOT_APPLICABLE, never STRETCH
          missing_ingredients_gt: 5
          incoherent_for_healthy_snacking: true
        STRETCH:
          out_of_scope_swappable_between: [1, 2]   # count 1-2 AND is_core NO
          adjacent_line_only: true
          missing_ingredients_between: [3, 5]
        FEASIBLE:
          quotable_covering_product_line: true
          out_of_scope_ingredients_eq: 0
          missing_ingredients_lte: 2

      # The founder-facing framework the gate implements. Three mutually exclusive buckets,
      # checked in order. Documentation only — keep in sync with hitl_approval's
      # `instruction`, the only copy the model reads.
      triage_tiers:
        automatic_reject:
          - portfolio_duplicate_exact          # same product, flavour AND pack size
          - out_of_scope_is_core               # off-brand active as the premise
          - out_of_scope_ingredients_gte_3
          - unmanufacturable_form_factor       # except the demand-vs-capability escalation
          - prior_rejection_exists
          - missing_ingredients_gt_5
        # ALL of these, not any — a line extension alone once approved a STRETCH idea
        # carrying 3 net-new ingredients.
        automatic_approve:
          - in_scope_with_0_to_2_sourcing_gaps
          - feasibility_verdict_feasible
          - portfolio_duplicate_none_or_line_extension  # new flavour or pack size of a live SKU
        escalate_only_when:
          - high_demand_vs_capability_gap      # the ONE line that outranks a capability reject
          - reformulation_question             # count 1-2 and is_core NO
          - high_setup_cost_strong_unit_economics
          - feasibility_verdict_stretch
        # A check that did not run is not a check that passed.
        data_gap_escalates: true

      context_package:
        - key: idea_input
          source: event
          required: true

        # Founder-supplied overrides, read straight off the trigger payload
        # (`source: event` reads event.attributes[key], so an absent field is simply
        # missing, never an error). Deliberately NOT named `hypothesis` /
        # `target_cogs_inr`: those are step 1's produced facts, and the separate names
        # are what let it prefer the supplied value over its own parse.
        - key: hypothesis_input
          source: event

        - key: target_cogs_input
          source: event

        # THE FOUR KEYS BELOW ARE DISPLAY-ONLY. As list facts they arrive previewed to 4
        # rows, which is useless for reasoning and actively misleading — a 4-row sample
        # reads as a complete small table. Every step instruction therefore works from its
        # own fetch instead. These exist only to mint the Full Context cards, via
        # `post.resolve` (one card per distinct type+id in the rows a key read); this
        # process resolves no entity from the event, so without them the tab is empty and
        # hidden. `post.where` runs before resolve, and resolve costs one sequential lookup
        # per surviving id — that is the ceiling to watch when raising a `limit`.
        #
        # Live SKUs do NOT come from `portfolio_products`. They arrive through step 1's own
        # fetch as the view's `2_PORTFOLIO` arm. Do not point an instruction here again.
        - key: all_ideas
          source: dataset_search
          required: true
          query:
            entity_type: Product
            dataset: DIM_IDEA
            columns: [IDEA_ID, NAME, STAGE, HYPOTHESIS, THESIS_FIT, TARGET_COGS_INR, STAGE_ENTERED_AT]
            order_by: IDEA_ID
            order_dir: asc
            limit: 300
          # No `post.resolve` deliberately: resolving IDEA_ID minted up to 300 `Idea`
          # entities onto Full Context — a type absent from the ontology — swamping the
          # entities the run acted on, and every lookup missed anyway. Ideas belong to the
          # briefs and the Similar Pipeline Ideas table. Do not add it back unless ideas
          # are projected as real graph nodes.

        - key: portfolio_products
          source: dataset_search
          required: false
          query:
            entity_type: Product
            dataset: V_PRODUCT_ENRICHED
            # No CATEGORY: it does not exist on this view, and selecting it made the whole
            # key error in BigQuery and resolve empty on every run.
            columns: [SKU, DISPLAY_NAME, DESCRIPTION, STATUS, IS_ACTIVE]
            order_by: SKU
            order_dir: asc
            limit: 200
          post:
            where:
              - { field: IS_ACTIVE, op: eq, value: true }
            resolve:
              - { field: SKU, type: Product, as: DISPLAY_NAME }

        - key: active_competitors
          source: dataset_search
          required: false
          query:
            entity_type: Competitor
            dataset: DIM_COMPETITOR
            columns: [COMPETITOR_ID, COMPETITOR_NAME, CATEGORY, IS_ACTIVE]
            order_by: CATEGORY
            order_dir: asc
            limit: 200
          post:
            where:
              - { field: IS_ACTIVE, op: eq, value: true }
            sort_by: CATEGORY
            # `as` names a column the query already selects: the graph-resolved name is
            # written first, then the row's own value restores it — so the card is labelled
            # correctly whether or not a node exists, and the fact rows are unchanged.
            resolve:
              - { field: COMPETITOR_ID, type: Competitor, as: COMPETITOR_NAME }

        - key: active_competitor_products
          source: dataset_search
          required: false
          query:
            entity_type: CompetitorProduct
            dataset: DIM_COMPETITOR_PRODUCT
            columns: [COMPETITOR_PRODUCT_ID, PRODUCT_NAME, IS_ACTIVE, COMPETITOR_ID]
            order_by: COMPETITOR_ID
            order_dir: asc
            limit: 200
          post:
            where:
              - { field: IS_ACTIVE, op: eq, value: true }
            sort_by: COMPETITOR_ID
            # These are ALL active products, not the ones resembling the idea. To narrow
            # the tab, this sweep must be REMOVED as well as replaced:
            # add_context_entities only appends, deduped by (type, id).
            resolve:
              - { field: COMPETITOR_PRODUCT_ID, type: CompetitorProduct, as: PRODUCT_NAME }

      # These read the produced facts directly, bypassing the 4-row preview, so the full
      # briefs and tables render for the reviewer even though the gate model sees fragments.
      # Every `from` key is also announced to the gate as "DATA NEEDED FOR THE BRIEF".
      key_data:
        - title: Pipeline & Competitor Overlap
          summary: Pipeline overlap, live portfolio overlap, prior rejections, and competitor signal for this idea.
          views:
            - { view: markdown, from: triage_brief }

        - title: Similar Pipeline Ideas
          summary: Pipeline ideas and prior rejections similar to this idea.
          views:
            # Only what `similar_ideas` actually carries. HYPOTHESIS / THESIS_FIT /
            # STAGE_ENTERED_AT are not in the packed view, so listing them here would render
            # empty columns — an invitation to fill them in. To restore one, add it to the view,
            # the object contract AND this list, and re-measure the step-input budget first.
            - view: table
              from: similar_ideas
              columns: [IDEA_ID, NAME, STAGE, TARGET_COGS_INR]

        - title: Ingredient Availability
          summary: Which of the idea's ingredients we already source, what would be net-new, and what is off-brand.
          views:
            - { view: markdown, from: ingredient_brief }

        - title: Feasibility
          summary: Whether the idea falls inside the product lines and cost envelope we actually manufacture.
          views:
            - { view: markdown, from: feasibility_brief }
            - view: table
              from: production_capability
              columns: [CATEGORY_NAME, PRODUCT_LINE_NAME, ACTIVE_SKUS, MIN_COGS_INR, MAX_COGS_INR]

        - title: Market Research
          summary: External price, channels and customer reach from live web research.
          views:
            - { view: markdown, from: market_situation_brief }

        - title: Similar Competitor Products
          summary: Active competitor products similar to this idea.
          views:
            - view: table
              from: similar_competitor_products
              columns: [COMPETITOR_PRODUCT_ID, PRODUCT_NAME, COMPETITOR_ID]

      # Documentation only: parsed into ProcessDefinition.policy_rules, but the EventAgent
      # path has no POLICY line, so nothing here reaches a model. The rules that decide the
      # recommendation live in hitl_approval's `instruction` — keep the two in sync.
      policy_rules:
            - "Each step reasons ONLY over its own `fetch`/`skill` data. `all_ideas`, `portfolio_products`, `active_competitors` and `active_competitor_products` arrive previewed to four rows and exist only to mint Full Context cards — never read a value from them, never infer absence from them."
            - "V_TRIAGE_SIMILARITY_CANDIDATES is FOUR packed columns (SRC, ID, NM, D) because a column name is a JSON key on every row and STEP INPUT DATA caps at 9000 chars — the old ten-column shape measured 16904 and truncated every run. Per-grain fields are packed positionally into D; keep the layout in sync across sql/views.sql and both step legends."
            - "The candidate set is read by TWO steps, each filtering SRC to its own arms so each gets its own 9000-char budget: match_pipeline_ideas takes 1_IDEA + 9_END, match_portfolio_and_market takes 2_PORT + 3_CAT + 4_COMP + 9_END. Splitting is what makes it durable — packed-but-unsplit fits only until DIM_IDEA grows a dozen rows. Keep the two filters exhaustive."
            - "SRC is numerically prefixed so alphabetical order is importance order, and 9_END sorts LAST so it is the first row a tail cut destroys — its absence is the only truncation signal either step has. Never renumber the sentinel below an arm."
            - "The set is complete ONLY if 5_END is present. Without it the tail was cut: report TRUNCATED, never write 'None found', never treat absence as evidence. Counts come from the 3_CATEGORY packed values and are correct per row — never recount rows; `not_comparable` is not zero."
            - "`idea_input` is an id only when character-for-character equal to a 1_IDEA CANDIDATE_ID. A close name match must not set `matched_idea_id`: a name-only re-triage deliberately creates a new record rather than overwriting the wrong one. Only STAGE = 'Rejected' evidences a prior rejection."
            - "Write-back fields (`hypothesis`, `thesis_fit`, `target_cogs_inr`) are copied verbatim and go straight into DIM_IDEA. Null is safe — the MERGE coalesces, so a null preserves the stored value."
            - "Off-thesis ingredients turn on whether the active is the PREMISE, not only how many: `out_of_scope_is_core` YES is a REJECT at any count; count 1-2 with is_core NO is a reformulation question and ESCALATES; count >= 3 REJECTS regardless. `missing_ingredient_count`: <=2 clean, 3-5 escalate, >5 reject."
            - "`portfolio_duplicate` is a three-way verdict, not a similarity score: EXACT (same product, flavour AND pack size) auto-REJECTS; LINE_EXTENSION (new flavour or pack size of a live SKU) auto-APPROVES, since we already own the line, recipe and supply chain; NONE means no live SKU is the same product. When flavour or pack size is unreadable, choose LINE_EXTENSION."
            - "`feasibility_verdict` follows metadata.feasibility_ladder and needs a product line quotable verbatim from `production_capability`. No quotable covering line means NOT_APPLICABLE, never STRETCH. An absent or failed fetch means unknown, not 'never made' — which is why all three fetches are required."
            - "Recommend from the three mutually exclusive tiers in metadata.triage_tiers, in order, stopping at the first match. ESCALATE is a closed list, not the leftovers. Data gaps override all three: a check that did not run is not a check that passed, so ESCALATE and name what is missing."
            - "The gate reads only short scalars and the four one-line reasons; the briefs and tables reach the reviewer through key_data. This is why each list has a matching `*_count`: the tier rules need integers, not lists."
            - "Founder-facing text — the briefs, the four `*_reason` sentences and the gate's reason cards — carries no field names, enum values or row labels. Name the business evidence (idea name, SKU name, ingredient, number), never the field it came from, and lead with names rather than ids."
            - "`market_reason` is external web data and directional only. Never decide on it alone; corroborate with `competitive_reason`. Every price, rating or review count must cite its source domain or be dropped."
      actions:
        - name: upsert_idea_row
          decision: APPROVE
          connector: context_graph
          config:
            type: dataset_upsert
            entity_type: Product
            source_table: DIM_IDEA
            dataset: ctx_upside_master_data
            key_column: IDEA_ID
            key_prefix: IDEA_
            generate_key_if_blank: true
            row:
              IDEA_ID: "{{facts.matched_idea_id}}"
              NAME: "{{facts.idea_name}}"
              STAGE: Triage
              HYPOTHESIS: "{{facts.hypothesis}}"
              THESIS_FIT: "{{facts.thesis_fit}}"
              TARGET_COGS_INR: "{{facts.target_cogs_inr}}"

        - name: advance_idea_to_triage
          decision: APPROVE
          connector: notify
          config:
            type: notify
            recipient: npd_team
            message: "Idea approved at triage — stage advances to Triage in DIM_IDEA."

        - name: log_idea_approval_status
          decision: APPROVE
          connector: simulated
          config:
            type: simulated
            note: "Approval logged. Updated STAGE = 'Triage' in DIM_IDEA for the triaged idea."

        - name: reject_idea_row
          decision: REJECT
          connector: context_graph
          config:
            type: dataset_upsert
            entity_type: Product
            source_table: DIM_IDEA
            dataset: ctx_upside_master_data
            key_column: IDEA_ID
            key_prefix: IDEA_
            generate_key_if_blank: true
            row:
              IDEA_ID: "{{facts.matched_idea_id}}"
              NAME: "{{facts.idea_name}}"
              STAGE: Rejected
              HYPOTHESIS: "{{facts.hypothesis}}"
              THESIS_FIT: "{{facts.thesis_fit}}"
              TARGET_COGS_INR: "{{facts.target_cogs_inr}}"

        - name: reject_idea
          decision: REJECT
          connector: notify
          config:
            type: notify
            recipient: npd_team
            message: "Idea rejected at triage — stage set to Rejected. Future triage runs will flag it as a prior-rejected match."

        - name: log_idea_rejection_status
          decision: REJECT
          connector: simulated
          config:
            type: simulated
            note: "Rejection logged. Update STAGE = 'Rejected' in DIM_IDEA for the triaged idea."

        - name: escalate_idea_review
          decision: ESCALATE
          connector: simulated
          config:
            type: simulated
            note: "Idea triage escalated for founder review — ambiguous match or mixed market signal."
